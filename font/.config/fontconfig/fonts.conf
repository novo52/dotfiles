<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

  <!-- One monospace font on every machine, so terminal text and icon glyphs share metrics. -->
  <alias binding="strong">
    <family>monospace</family>
    <prefer>
      <family>JetBrainsMonoNL Nerd Font Mono</family>
    </prefer>
  </alias>

  <!-- Icon codepoints sit in the Private Use Area (U+E000-F8FF), which several CJK fonts also
       map, so without a font that genuinely covers them earlier in the chain they render as Han
       or Hangul glyphs. Each rule below is scoped to one monospace family: a pattern-wide rule
       would also win for proportional families that are not installed, turning body text
       monospace. -->

  <match target="pattern">
    <test name="family" qual="any" compare="eq"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="weak"><string>JetBrainsMonoNL Nerd Font Mono</string></edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any" compare="eq"><string>DejaVu Sans Mono</string></test>
    <edit name="family" mode="prepend" binding="weak"><string>JetBrainsMonoNL Nerd Font Mono</string></edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any" compare="eq"><string>JetBrains Mono</string></test>
    <edit name="family" mode="prepend" binding="weak"><string>JetBrainsMonoNL Nerd Font Mono</string></edit>
  </match>

</fontconfig>
