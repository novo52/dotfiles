# Syntax here stays within tmux 3.0a, the oldest version in use.

set-window-option -g mode-keys vi

# Clipboard over OSC 52, so a copy reaches the system clipboard of whatever
# terminal is attached: locally, over ssh, and under WSL alike. Nothing here
# needs an X display.
set -s set-clipboard on

# tmux only emits OSC 52 for a terminal whose terminfo advertises Ms, and the
# stock xterm-256color and tmux-256color entries do not. `terminal-features`
# would be the modern way to say this; it arrived in 3.2, and an unknown option
# aborts the rest of the file on 3.0a.
set -ga terminal-overrides ',xterm*:Ms=\E]52;%p1%s;%p2%s\007'
set -ga terminal-overrides ',screen*:Ms=\E]52;%p1%s;%p2%s\007'
set -ga terminal-overrides ',tmux*:Ms=\E]52;%p1%s;%p2%s\007'
set -ga terminal-overrides ',alacritty:Ms=\E]52;%p1%s;%p2%s\007'

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Move the current window left or right in the tab order.
bind-key -r < swap-window -t -1 \; previous-window
bind-key -r > swap-window -t +1 \; next-window
