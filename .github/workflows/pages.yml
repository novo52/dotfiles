# Publishes bootstrap.sh as a one-file site, so that the site's bare URL can be
# piped to sh.
name: pages

on:
  push:
    branches: [main]
    paths:
      - bootstrap/bootstrap.sh
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir site
          # Pages serves bootstrap.sh as application/x-sh, which a browser
          # downloads, and index.html for the bare URL as text/html.
          cp bootstrap/bootstrap.sh site/bootstrap.sh
          # The index is the script under one extra first line: a comment to
          # sh, and to a browser a redirect to the downloadable copy with the
          # rest of the page commented out.
          {
            printf '%s\n' "#<script>location.replace('bootstrap.sh')</script><!--"
            cat bootstrap/bootstrap.sh
          } > site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
