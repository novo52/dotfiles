# Publishes bootstrap.sh as a one-file site, so that the site's bare URL can be
# piped to sh.
name: pages

on:
  push:
    branches: [main]
    paths:
      - bootstrap/bootstrap.sh
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir site
          # Pages serves index.html for the bare URL; the same script is also
          # there under its own name.
          cp bootstrap/bootstrap.sh site/index.html
          cp bootstrap/bootstrap.sh site/bootstrap.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
